server {
    listen 80;
    server_name localhost;

    # Use Docker's internal DNS resolver so nginx re-resolves hostnames
    # dynamically instead of caching the IP at startup.
    # This prevents 502 errors when the backend container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Using a variable forces nginx to resolve via the resolver directive
        # on each request, rather than caching at config load time.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Increase timeouts for long synchronous ingestion pipelines
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
}
