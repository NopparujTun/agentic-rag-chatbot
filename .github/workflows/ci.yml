name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        
    - name: Lint with ruff
      run: |
        ruff check backend/app
        
    - name: Test with pytest
      run: |
        # Wait for pytest configuration to be fully set up before failing if tests don't exist yet
        # pytest backend/
        echo "No tests configured yet. Skipping pytest for now."

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build backend Docker image
      run: |
        docker build -t agentic-rag-backend:latest ./backend
        
    - name: Build frontend Docker image
      run: |
        docker build -t agentic-rag-frontend:latest ./frontend
